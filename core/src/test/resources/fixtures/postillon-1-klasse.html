<p>Berlin (dpo) - Darüber werden sich viele Zugreisende freuen: Wie die Deutsche Bahn heute mitteilte, sollen Wagen der 1. Klasse ab Dezember dieses Jahres 10 km/h schneller unterwegs sein als Wagen der 2. Klasse. So sollen je nach Strecke bis zu 18 Minuten Fahrzeit eingespart werden. </p>
